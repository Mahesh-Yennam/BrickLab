<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00aa66"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#990044"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Row 1: Balanced Bricks -->
  <rect x="64" y="68" width="108" height="96" rx="20" fill="url(#cyanGrad)"/>
  <rect x="188" y="68" width="136" height="96" rx="20" fill="url(#greenGrad)"/>
  <rect x="340" y="68" width="108" height="96" rx="20" fill="url(#pinkGrad)"/>

  <!-- Row 2: Kinetic Expanded Center Brick (The Signature Fluid Spring) -->
  <rect x="64" y="184" width="76" height="112" rx="18" fill="url(#cyanGrad)"/>
  <rect x="156" y="174" width="232" height="132" rx="26" fill="url(#greenGrad)" filter="url(#neonGlow)"/>
  <!-- Highlight stroke for expanded brick -->
  <rect x="156" y="174" width="232" height="132" rx="26" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="404" y="184" width="44" height="112" rx="18" fill="url(#pinkGrad)"/>

  <!-- Row 3: Balanced Bricks with Amber Accent -->
  <rect x="64" y="326" width="124" height="96" rx="20" fill="url(#cyanGrad)"/>
  <rect x="204" y="326" width="104" height="96" rx="20" fill="url(#amberGrad)"/>
  <rect x="324" y="326" width="124" height="96" rx="20" fill="url(#pinkGrad)"/>

  <!-- Subtle Flask Icon overlay in center representing BrickLab -->
  <circle cx="272" cy="240" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="250" cy="225" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="290" cy="220" r="9" fill="#ffffff" opacity="0.7"/>
</svg>

